<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRIOFIT · AI Stylist</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --gold: #d4a853;
      --text: #f0f0f0;
      --text-muted: #999;
      --border-subtle: rgba(255,255,255,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 430px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .app::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212,168,83,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 6s ease-in-out infinite;
    }
    @keyframes ambientPulse {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
    }
    .header {
      position: relative;
      z-index: 2;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #d4a853 0%, #b8861e 100%);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #0a0a0a;
      box-shadow: 0 4px 15px rgba(212,168,83,0.3);
      animation: logoShine 3s ease-in-out infinite;
    }
    @keyframes logoShine {
      0%, 100% { box-shadow: 0 4px 15px rgba(212,168,83,0.3); }
      50% { box-shadow: 0 4px 25px rgba(212,168,83,0.55); }
    }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .status-dot {
      width: 8px; height: 8px;
      background: #4ade80; border-radius: 50%;
      display: inline-block; margin-right: 4px;
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(74,222,128,0); }
    }
    .online-badge { font-size: 11px; color: #4ade80; font-weight: 500; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .typing-indicator {
      align-self: flex-start;
      display: flex; gap: 5px;
      padding: 14px 18px;
      background: var(--surface2);
      border-radius: 20px 20px 20px 4px;
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--gold); border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 20px;
      word-break: break-word;
      line-height: 1.5;
      font-size: 15px;
    }
    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-right-radius: 4px;
    }
    .bubble.admin {
      align-self: flex-start;
      background: linear-gradient(135deg, #1c1410 0%, #2a1f14 100%);
      border: 1px solid rgba(212,168,83,0.15);
      border-bottom-left-radius: 4px;
    }
    .bubble .time {
      font-size: 10px; opacity: 0.5;
      margin-top: 6px; text-align: right;
    }
    .quick-replies {
      display: none;
      flex-wrap: wrap; gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      z-index: 2;
    }
    .chip {
      padding: 10px 18px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .chip:active { background: var(--gold); color: #0a0a0a; }
    .input-area {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-subtle);
      position: relative; z-index: 2;
    }
    .input-wrapper {
      flex: 1;
      display: flex; align-items: center;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 6px 8px 6px 18px;
    }
    .input-wrapper:focus-within { border-color: var(--gold); }
    .input-wrapper input {
      flex: 1;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 16px;
      padding: 8px 0; font-family: inherit;
    }
    .input-wrapper input::placeholder { color: #555; }
    .send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4a853 0%, #b8861e 100%);
      border: none;
      color: #0a0a0a; font-size: 18px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212,168,83,0.35);
      flex-shrink: 0;
    }
    .send-btn:active { transform: scale(0.9); }

    /* Onboarding / Name screen */
    .onboarding-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      z-index: 5;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .onboarding-icon {
      font-size: 60px;
      margin-bottom: 20px;
      animation: floatIcon 4s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .onboarding-title {
      font-size: 22px; font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #d4a853, #e8c97a, #d4a853);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    .onboarding-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .name-input {
      width: 100%;
      max-width: 280px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid rgba(212,168,83,0.3);
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      text-align: center;
      outline: none;
      font-family: inherit;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .name-input:focus { border-color: var(--gold); }
    .name-input::placeholder { color: #555; }
    .start-btn {
      width: 100%;
      max-width: 280px;
      padding: 14px;
      background: linear-gradient(135deg, #d4a853, #b8861e);
      border: none;
      border-radius: 16px;
      color: #0a0a0a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .start-btn:active { transform: scale(0.97); opacity: 0.9; }
    .start-btn:disabled { opacity: 0.5; }

    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: #1c1c1c; color: var(--text);
      padding: 10px 24px; border-radius: 30px;
      font-size: 13px; z-index: 1000;
      border: 1px solid var(--border-subtle);
      animation: toastIn 0.4s ease, toastOut 0.3s ease 2s forwards;
      pointer-events: none;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>

<div class="app" id="app">

  <!-- ONBOARDING SCREEN -->
  <div class="onboarding-screen" id="onboardingScreen">
    <div class="onboarding-icon">✨</div>
    <div class="onboarding-title">Welcome to TRIOFIT</div>
    <div class="onboarding-subtitle">
      Your AI personal stylist.<br>
      What should I call you?
    </div>
    <input type="text" class="name-input" id="nameInput" placeholder="Your first name..." maxlength="30" autocomplete="off">
    <button class="start-btn" id="startBtn" onclick="saveName()">Start Styling →</button>
  </div>

  <!-- CHAT SCREEN (hidden until name is set) -->
  <div id="chatScreen" style="display: none; flex: 1; flex-direction: column;">
    <div class="header">
      <div class="header-brand">
        <div class="logo-icon">T</div>
        <div>
          <div class="header-title">TRIOFIT</div>
          <div class="header-subtitle">AI Personal Stylist</div>
        </div>
      </div>
      <div>
        <span class="status-dot"></span>
        <span class="online-badge">Online</span>
      </div>
    </div>

    <div class="messages" id="userMessages"></div>

    <div class="quick-replies" id="quickReplies"></div>

    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Describe your style need..." autocomplete="off" maxlength="500">
      </div>
      <button class="send-btn" id="sendBtn">↑</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ahckbchulymvbhrpynyy.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY2tiY2h1bHltdmJocnB5bnl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTI5MTQsImV4cCI6MjA5NjM4ODkxNH0.aBq-qHBBTrzWf_OHpkYmQLLPeS1iywBbX47tLRqRQ1k';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Get or create user identity
  let USER_NAME = localStorage.getItem('triofit_name');
  let USER_SESSION = localStorage.getItem('triofit_session');

  const onboardingScreen = document.getElementById('onboardingScreen');
  const chatScreen = document.getElementById('chatScreen');
  const userMessages = document.getElementById('userMessages');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const quickReplies = document.getElementById('quickReplies');
  const nameInput = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');

  // If user already has a name and session, skip onboarding
  if (USER_NAME && USER_SESSION) {
    showChat();
  } else {
    onboardingScreen.style.display = 'flex';
    chatScreen.style.display = 'none';
  }

  // Allow Enter key to submit name
  nameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') saveName();
  });

  function saveName() {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.style.borderColor = '#ef4444';
      nameInput.placeholder = 'Please enter your name';
      return;
    }
    
    // Capitalize first letter
    const formattedName = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
    
    // Store in localStorage (persists forever)
    localStorage.setItem('triofit_name', formattedName);
    USER_NAME = formattedName;

    // Create session ID with the user's name embedded
    if (!USER_SESSION) {
      USER_SESSION = formattedName + '_' + Date.now();
      localStorage.setItem('triofit_session', USER_SESSION);
    }

    // Show chat
    showChat();
  }

  function showChat() {
    onboardingScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    loadHistory();
  }

  function scrollToBottom() {
    userMessages.scrollTop = userMessages.scrollHeight;
  }

  function addBubble(msg) {
    const div = document.createElement('div');
    div.className = 'bubble ' + msg.sender;
    div.innerHTML = msg.message + '<div class="time">' + new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</div>';
    userMessages.appendChild(div);
    scrollToBottom();
  }

  async function loadHistory() {
    const { data } = await supabase
      .from('messages')
      .select('*')
      .eq('session_id', USER_SESSION)
      .order('created_at', { ascending: true })
      .limit(100);
    if (data && data.length > 0) {
      userMessages.innerHTML = '';
      data.forEach(msg => addBubble(msg));
    }
  }

  async function sendMessage(text) {
    const messageText = text || userInput.value.trim();
    if (!messageText) return;
    if (!text) userInput.value = '';

    const { error } = await supabase.from('messages').insert({
      session_id: USER_SESSION,
      sender: 'user',
      message: messageText,
      message_type: 'text'
    });

    if (error) {
      console.error('Send error:', error);
    }
  }

  function sendQuickMessage(text) {
    userInput.value = text;
    sendMessage(text);
  }

  sendBtn.addEventListener('click', () => {
    const text = userInput.value.trim();
    if (text) sendMessage(text);
  });

  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const text = userInput.value.trim();
      if (text) sendMessage(text);
    }
  });

  // Real-time subscription
  supabase
    .channel('user-replies')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages',
      filter: 'session_id=eq.' + USER_SESSION
    }, (payload) => {
      const msg = payload.new;
      if (msg.sender === 'user') {
        addBubble(msg);
        // Show typing indicator
        const typing = document.createElement('div');
        typing.className = 'typing-indicator';
        typing.id = 'typingIndicator';
        typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        userMessages.appendChild(typing);
        scrollToBottom();
      } else if (msg.sender === 'admin') {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
        addBubble(msg);
        // Show quick replies
        quickReplies.style.display = 'flex';
        quickReplies.innerHTML = `
          <div class="chip" onclick="sendQuickMessage('Show me more options')">Show more</div>
          <div class="chip" onclick="sendQuickMessage('What stores have these?')">Nearby stores</div>
          <div class="chip" onclick="sendQuickMessage('What\\'s the price?')">Price range</div>
          <div class="chip" onclick="sendQuickMessage('Thanks!')">Thanks! ✨</div>
        `;
        setTimeout(() => { quickReplies.style.display = 'none'; }, 15000);
      }
    })
    .subscribe();

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
