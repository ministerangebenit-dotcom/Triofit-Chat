<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TRIOFIT · AI Stylist</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --gold: #d4a853;
      --gold-light: #e8c97a;
      --text: #f0f0f0;
      --text-muted: #999;
      --accent: #c5963c;
      --user-bubble: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      --admin-bubble: linear-gradient(135deg, #1c1410 0%, #2a1f14 100%);
      --border-subtle: rgba(255,255,255,0.06);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ============ APP SHELL ============ */
    .app {
      max-width: 430px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    /* Ambient glow behind the app */
    .app::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212,168,83,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 6s ease-in-out infinite;
    }

    @keyframes ambientPulse {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
    }

    /* ============ HEADER ============ */
    .header {
      position: relative;
      z-index: 2;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #d4a853 0%, #b8861e 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #0a0a0a;
      box-shadow: 0 4px 15px rgba(212,168,83,0.3);
      animation: logoShine 3s ease-in-out infinite;
    }

    @keyframes logoShine {
      0%, 100% { box-shadow: 0 4px 15px rgba(212,168,83,0.3); }
      50% { box-shadow: 0 4px 25px rgba(212,168,83,0.55); }
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      animation: statusPulse 2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74,222,128,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(74,222,128,0); }
    }

    .online-badge {
      font-size: 11px;
      color: #4ade80;
      font-weight: 500;
    }

    /* ============ MESSAGES AREA ============ */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 3px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    /* Typing indicator */
    .typing-indicator {
      align-self: flex-start;
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--surface2);
      border-radius: 20px 20px 20px 4px;
      animation: fadeInUp 0.3s ease;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
      animation: typingBounce 1.4s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* ============ MESSAGE BUBBLES ============ */
    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 20px;
      word-break: break-word;
      line-height: 1.5;
      font-size: 15px;
      position: relative;
      animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transition: transform 0.15s ease;
    }

    .bubble:active {
      transform: scale(0.97);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* User bubble */
    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    .bubble.user::after {
      content: '';
      position: absolute;
      right: -6px;
      bottom: 0;
      width: 12px;
      height: 12px;
      background: #1a1a1a;
      clip-path: polygon(0 0, 0% 100%, 100% 100%);
      border-left: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* Admin/Stylist bubble */
    .bubble.admin {
      align-self: flex-start;
      background: var(--admin-bubble);
      border: 1px solid rgba(212,168,83,0.15);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .bubble.admin::before {
      content: '✨';
      position: absolute;
      left: -8px;
      top: -8px;
      font-size: 12px;
      animation: sparkleFloat 3s ease-in-out infinite;
    }

    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-4px) rotate(15deg); opacity: 1; }
    }

    .bubble .time {
      font-size: 10px;
      opacity: 0.5;
      margin-top: 6px;
      text-align: right;
      letter-spacing: 0.3px;
    }

    /* Image attachment placeholder */
    .bubble-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 6px;
      overflow: hidden;
    }

    /* ============ QUICK REPLIES (CHIPS) ============ */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      z-index: 2;
      animation: fadeInUp 0.4s ease;
    }

    .chip {
      padding: 10px 18px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .chip:hover, .chip:active {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212,168,83,0.25);
    }

    /* ============ INPUT AREA ============ */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--border-subtle);
      position: relative;
      z-index: 2;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 6px 8px 6px 18px;
      transition: all 0.3s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,168,83,0.1);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      padding: 8px 0;
      font-family: inherit;
    }

    .input-wrapper input::placeholder {
      color: #555;
    }

    .attach-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .attach-btn:active {
      color: var(--gold);
      transform: scale(0.9);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4a853 0%, #b8861e 100%);
      border: none;
      color: #0a0a0a;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(212,168,83,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.9);
      box-shadow: 0 2px 10px rgba(212,168,83,0.5);
    }

    .send-btn.sending {
      animation: sendPulse 0.6s ease;
    }

    @keyframes sendPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    /* ============ WELCOME SCREEN ============ */
    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      z-index: 1;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .welcome-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #d4a853 0%, #b8861e 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 24px;
      box-shadow: 0 20px 50px rgba(212,168,83,0.3);
      animation: floatIcon 4s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #d4a853, #e8c97a, #d4a853);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .welcome-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .welcome-chip {
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid rgba(212,168,83,0.2);
      border-radius: 16px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .welcome-chip:active {
      background: var(--gold);
      color: #0a0a0a;
      transform: scale(0.96);
    }

    /* ============ ADMIN PANEL ============ */
    #adminView {
      display: none;
    }
    #adminView.active {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg);
    }

    .admin-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .admin-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--gold);
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:active {
      background: rgba(255,255,255,0.05);
    }

    .session-scroll {
      display: flex;
      gap: 8px;
      padding: 12px;
      overflow-x: auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
    }
    .session-scroll::-webkit-scrollbar {
      display: none;
    }

    .session-pill {
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .session-pill.active {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
      box-shadow: 0 4px 15px rgba(212,168,83,0.3);
    }

    .admin-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .admin-input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border-subtle);
    }
    .admin-input-area input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 24px;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .admin-input-area input:focus {
      border-color: var(--gold);
    }
    .admin-input-area button {
      padding: 12px 20px;
      border-radius: 24px;
      background: var(--gold);
      color: #0a0a0a;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-input-area button:active {
      transform: scale(0.95);
    }
    .no-session-hint {
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      font-size: 14px;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      z-index: 1000;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1), toastOut 0.3s ease 2s forwards;
      pointer-events: none;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- ==================== USER VIEW ==================== -->
  <div class="app" id="userView">
    <!-- Header -->
    <div class="header">
      <div class="header-brand">
        <div class="logo-icon">T</div>
        <div>
          <div class="header-title">TRIOFIT</div>
          <div class="header-subtitle">AI Personal Stylist</div>
        </div>
      </div>
      <div>
        <span class="status-dot"></span>
        <span class="online-badge">Online</span>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="userMessages">
      <!-- Welcome screen (shown when no messages) -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">✨</div>
        <div class="welcome-title">Your Personal Stylist</div>
        <div class="welcome-subtitle">
          I'll help you find the perfect outfit for any occasion.<br>
          Just tell me what you're looking for.
        </div>
        <div class="welcome-chips">
          <div class="welcome-chip" onclick="sendQuickMessage('I need an outfit for a party tonight')">🎉 Party outfit</div>
          <div class="welcome-chip" onclick="sendQuickMessage('What should I wear for work tomorrow?')">💼 Work look</div>
          <div class="welcome-chip" onclick="sendQuickMessage('Help me style a casual weekend outfit')">👟 Casual fit</div>
          <div class="welcome-chip" onclick="sendQuickMessage('I have a date, help!')">💕 Date night</div>
        </div>
      </div>
    </div>

    <!-- Quick replies (hidden by default) -->
    <div class="quick-replies" id="quickReplies" style="display: none;"></div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Describe your style need..." autocomplete="off" maxlength="500">
        <button class="attach-btn" aria-label="Attach">📎</button>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="Send">↑</button>
    </div>
  </div>

  <!-- ==================== ADMIN VIEW ==================== -->
  <div id="adminView">
    <div class="admin-header">
      <h3>✦ Admin Panel</h3>
      <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </div>
    <div class="session-scroll" id="sessionList"></div>
    <div class="admin-messages" id="adminMessages">
      <div class="no-session-hint" id="noSessionHint">👈 Select a conversation to reply</div>
    </div>
    <div class="admin-input-area" id="adminInputArea" style="display: none;">
      <input type="text" id="adminInput" placeholder="Type reply as stylist..." autocomplete="off">
      <button id="adminSendBtn">Send</button>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==================== CONFIGURATION ====================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY2tiY2h1bHltdmJocnB5bnl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTI5MTQsImV4cCI6MjA5NjM4ODkxNH0.aBq-qHBBTrzWf_OHpkYmQLLPeS1iywBbX47tLRqRQ1k';
    const ADMIN_PASSWORD = 'triofit2026';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==================== USER SESSION ====================
    let USER_SESSION = localStorage.getItem('triofit_session');
    if (!USER_SESSION) {
      USER_SESSION = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      localStorage.setItem('triofit_session', USER_SESSION);
    }

    // ==================== DOM ELEMENTS ====================
    const userMessages = document.getElementById('userMessages');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const quickReplies = document.getElementById('quickReplies');
    const userView = document.getElementById('userView');
    const adminView = document.getElementById('adminView');

    // ==================== HELPER FUNCTIONS ====================
    function scrollToBottom(container) {
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
      });
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function hideWelcome() {
      if (welcomeScreen && welcomeScreen.style.display !== 'none') {
        welcomeScreen.style.display = 'none';
      }
    }

    function addBubble(msg, container) {
      hideWelcome();
      const div = document.createElement('div');
      div.className = 'bubble ' + msg.sender;
      div.innerHTML = msg.message + '<div class="time">' + new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</div>';
      container.appendChild(div);
      scrollToBottom(container);
    }

    function showTyping(container) {
      hideWelcome();
      const typing = document.createElement('div');
      typing.className = 'typing-indicator';
      typing.id = 'typingIndicator';
      typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      container.appendChild(typing);
      scrollToBottom(container);
    }

    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // ==================== USER VIEW ====================
    async function loadUserHistory() {
      const { data } = await supabase
        .from('messages')
        .select('*')
        .eq('session_id', USER_SESSION)
        .order('created_at', { ascending: true })
        .limit(100);
      if (data && data.length > 0) {
        hideWelcome();
        data.forEach(msg => addBubble(msg, userMessages));
      }
    }

    async function sendUserMessage(text) {
      if (!text) return;
      userInput.value = '';
      sendBtn.classList.add('sending');
      setTimeout(() => sendBtn.classList.remove('sending'), 600);

      const { error } = await supabase.from('messages').insert({
        session_id: USER_SESSION,
        sender: 'user',
        message: text
      });
      if (error) {
        showToast('Failed to send. Try again.');
        console.error(error);
      }
      // Message appears via subscription
    }

    function sendQuickMessage(text) {
      userInput.value = text;
      sendUserMessage(text);
    }

    // Send button
    sendBtn.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text) sendUserMessage(text);
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = userInput.value.trim();
        if (text) sendUserMessage(text);
      }
    });

    // Real-time subscription for user
    let userHasMessages = false;
    supabase
      .channel('user-replies')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages',
        filter: `session_id=eq.${USER_SESSION}`
      }, (payload) => {
        const msg = payload.new;
        if (msg.sender === 'user') {
          addBubble(msg, userMessages);
          userHasMessages = true;
          // Show typing indicator for admin response
          showTyping(userMessages);
          // Hide typing after 3 seconds (or when admin replies)
          setTimeout(() => {
            // Only hide if admin hasn't replied
            const hasNewAdminReply = document.querySelector('.bubble.admin')?.textContent?.includes(msg.message);
            hideTyping();
          }, 3000);
        } else if (msg.sender === 'admin') {
          hideTyping();
          addBubble(msg, userMessages);
          // Show quick reply chips after admin response
          showQuickReplies();
        }
      })
      .subscribe();

    function showQuickReplies() {
      quickReplies.style.display = 'flex';
      quickReplies.innerHTML = `
        <div class="chip" onclick="sendQuickMessage('Show me more options')">Show more</div>
        <div class="chip" onclick="sendQuickMessage('What stores have these?')">Nearby stores</div>
        <div class="chip" onclick="sendQuickMessage('What's the price?')">Price range</div>
        <div class="chip" onclick="sendQuickMessage('Thanks!')">Thanks! ✨</div>
      `;
      setTimeout(() => { quickReplies.style.display = 'none'; }, 15000);
    }

    // Load history on startup
    loadUserHistory();

    // ==================== ADMIN VIEW ====================
    let activeSession = null;
    let allSessions = [];

    if (window.location.search.includes('admin')) {
      const pw = prompt('Enter admin password:');
      if (pw === ADMIN_PASSWORD) {
        userView.style.display = 'none';
        adminView.classList.add('active');
        initAdmin();
      } else {
        alert('Wrong password');
        window.location.href = window.location.pathname;
      }
    }

    function logoutAdmin() {
      window.location.href = window.location.pathname;
    }

    async function initAdmin() {
      const { data } = await supabase
        .from('messages')
        .select('session_id, message, sender, created_at')
        .order('created_at', { ascending: false })
        .limit(500);

      if (data) {
        const map = new Map();
        data.forEach(row => {
          if (!map.has(row.session_id)) {
            map.set(row.session_id, { lastMessage: row.message, lastSender: row.sender, lastTime: row.created_at });
          }
        });
        allSessions = Array.from(map.entries()).map(([id, info]) => ({ id, ...info }));
        renderSessions();
      }

      // Subscribe to all new messages
      supabase.channel('admin-all')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          const s = payload.new.session_id;
          const existing = allSessions.find(x => x.id === s);
          if (!existing) {
            allSessions.unshift({ id: s, lastMessage: payload.new.message, lastSender: payload.new.sender, lastTime: payload.new.created_at });
          } else {
            existing.lastMessage = payload.new.message;
            existing.lastSender = payload.new.sender;
            existing.lastTime = payload.new.created_at;
          }
          renderSessions();
          if (activeSession === s && payload.new.sender === 'user') {
            addBubble(payload.new, document.getElementById('adminMessages'));
          }
        })
        .subscribe();
    }

    function renderSessions() {
      const container = document.getElementById('sessionList');
      container.innerHTML = allSessions.map(s =>
        `<div class="session-pill ${s.id === activeSession ? 'active' : ''}" onclick="openAdminSession('${s.id}')">
          ${s.id.replace('user_', '').substring(0, 10)}
        </div>`
      ).join('');
    }

    async function openAdminSession(sid) {
      activeSession = sid;
      document.getElementById('noSessionHint').style.display = 'none';
      document.getElementById('adminInputArea').style.display = 'flex';
      const adminMessages = document.getElementById('adminMessages');
      adminMessages.innerHTML = '';
      const { data } = await supabase
        .from('messages')
        .select('*')
        .eq('session_id', sid)
        .order('created_at', { ascending: true });
      if (data) data.forEach(msg => addBubble(msg, adminMessages));
      renderSessions();
      document.getElementById('adminInput').focus();
    }

    document.getElementById('adminSendBtn').addEventListener('click', async () => {
      if (!activeSession) return;
      const input = document.getElementById('adminInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await supabase.from('messages').insert({
        session_id: activeSession,
        sender: 'admin',
        message: text
      });
      addBubble({
        session_id: activeSession,
        sender: 'admin',
        message: text,
        created_at: new Date().toISOString()
      }, document.getElementById('adminMessages'));
      showToast('Reply sent ✨');
    });

    document.getElementById('adminInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('adminSendBtn').click();
    });

    // ==================== SERVICE WORKER ====================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
