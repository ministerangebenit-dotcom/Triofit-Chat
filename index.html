<style>
:root {
  --bg: #070707;
  --surface: #101010;
  --surface2: #181818;
  --surface3: #202020;
  --gold: #b8893a;
  --gold-light: #d4a84b;
  --gold-pale: rgba(184,137,58,0.1);
  --gold-border: rgba(184,137,58,0.22);
  --text: #efefef;
  --text-muted: #555;
  --text-dim: #888;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── SCREENS ── */
.screen {
  position:fixed; inset:0; display:flex; flex-direction:column;
  transition: opacity .42s cubic-bezier(.4,0,.2,1), transform .42s cubic-bezier(.4,0,.2,1);
}
.screen.hidden { opacity:0; pointer-events:none; transform:translateY(14px); }
.screen.out    { opacity:0; pointer-events:none; transform:translateY(-14px); }

/* ── LANG ── */
.lang-toggle {
  position:fixed; top:16px; right:16px; z-index:1000;
  display:flex; background:rgba(14,14,14,.95);
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px; padding:3px; gap:2px;
  backdrop-filter:blur(12px);
}
.lang-btn {
  padding:5px 13px; border-radius:14px;
  font-size:11px; font-weight:600; letter-spacing:.04em;
  border:none; background:none; color:var(--text-muted); cursor:pointer; transition:all .2s;
}
.lang-btn.on { background:var(--gold); color:#0a0a0a; }

/* ── SPLASH ── */
#splash {
  align-items:center; justify-content:center;
  padding:40px 28px; overflow:hidden; background:var(--bg);
}
.orb { position:absolute; border-radius:50%; filter:blur(90px); opacity:.1; animation:drift 10s ease-in-out infinite alternate; }
.orb1{width:420px;height:420px;background:var(--gold);top:-100px;right:-100px;}
.orb2{width:300px;height:300px;background:#6b4a18;bottom:-60px;left:-80px;animation-delay:-4s;}
.orb3{width:200px;height:200px;background:var(--gold-light);top:50%;left:20%;animation-delay:-7s;}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(16px,22px) scale(1.08)}}

.splash-inner {
  position:relative; z-index:1;
  width:100%; max-width:340px; margin:auto;
  text-align:center; display:flex; flex-direction:column; align-items:center;
}
.logo-mark {
  width:64px; height:64px; border-radius:16px;
  background:linear-gradient(145deg,var(--gold-light),#7a5418);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 16px;
  box-shadow:0 0 48px rgba(184,137,58,.25),0 8px 28px rgba(0,0,0,.6);
}
.logo-mark span { font-size:22px; font-weight:900; color:#fff; letter-spacing:-1px; }
.logo-wordmark  { font-size:22px; font-weight:800; letter-spacing:.18em; }
.logo-descriptor{ font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-top:6px; font-weight:500; }
.splash-headline { margin:30px 0 28px; }
.splash-headline h1 { font-size:clamp(22px,6.5vw,34px); font-weight:700; line-height:1.2; }
.splash-headline h1 em { font-style:normal; background:linear-gradient(90deg,var(--gold-light),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.splash-headline p { margin-top:14px; font-size:14px; color:var(--text-dim); line-height:1.65; max-width:280px; margin-left:auto; margin-right:auto; }
.btn-primary {
  width:100%; padding:15px 24px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  border:none; border-radius:50px; color:#080808;
  font-size:14px; font-weight:700; letter-spacing:.04em;
  cursor:pointer; box-shadow:0 4px 28px rgba(184,137,58,.3); transition:all .2s;
}
.btn-primary:active { transform:scale(.97); opacity:.9; }
.splash-trust { display:flex; align-items:center; gap:10px; margin-top:22px; font-size:11px; color:var(--text-muted); }
.sep { width:1px; height:11px; background:var(--surface3); }

/* ── NAME SCREEN ── */
#namescreen {
  align-items:center; justify-content:center;
  padding:40px 28px; background:var(--bg); overflow:hidden;
}
.namescreen-inner {
  position:relative; z-index:1;
  width:100%; max-width:340px;
  display:flex; flex-direction:column; gap:28px;
}
.ns-label { font-size:10px; font-weight:700; letter-spacing:.16em; color:var(--gold); text-transform:uppercase; }
.ns-title { font-size:24px; font-weight:700; line-height:1.2; margin-top:6px; }
.ns-sub   { font-size:14px; color:var(--text-dim); line-height:1.6; margin-top:8px; }
.field-input {
  width:100%; padding:14px 18px;
  background:var(--surface2);
  border:1.5px solid rgba(255,255,255,.06);
  border-radius:12px; color:var(--text);
  font-size:16px; font-family:inherit; outline:none;
  transition:border-color .2s; -webkit-appearance:none;
}
.field-input:focus { border-color:var(--gold-border); }
.field-input::placeholder { color:var(--text-muted); }

/* ── CHAT ── */
#chat { background:var(--bg); }

.chat-header {
  display:flex; align-items:center; gap:12px;
  padding:13px 18px;
  padding-top:max(13px, env(safe-area-inset-top));
  background:var(--surface);
  border-bottom:1px solid rgba(255,255,255,.04);
  flex-shrink:0;
}
.chat-avatar {
  width:36px; height:36px; border-radius:50%;
