<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TRIOFIT · Admin</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1c1c1c;
      --gold: #d4a853;
      --gold-dim: rgba(212,168,83,0.15);
      --text: #f0f0f0;
      --text-muted: #666;
      --border: rgba(255,255,255,0.06);
      --red: #ef4444;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LAYOUT ── */
    .app { display: flex; height: 100dvh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-mark {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #0a0a0a;
    }
    .brand-text { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: var(--gold); }
    .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 20px;
      background: rgba(74,222,128,0.08);
      border: 1px solid rgba(74,222,128,0.2);
      font-size: 11px; color: #4ade80;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: #4ade80; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .sessions-label {
      padding: 12px 16px 6px;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .sessions-list { flex:1; overflow-y: auto; padding: 6px 8px; }
    .sessions-list::-webkit-scrollbar { width: 4px; }
    .sessions-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .session-item {
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 2px;
      position: relative;
    }
    .session-item:hover { background: rgba(255,255,255,0.04); }
    .session-item.active { background: var(--gold-dim); }
    .session-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .session-item.active .session-avatar {
      background: var(--gold-dim);
      border-color: rgba(212,168,83,0.3);
    }
    .session-info { flex:1; overflow: hidden; }
    .session-id { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .unread-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold); flex-shrink: 0;
      animation: subtleGlow 2s ease-in-out infinite;
    }
    @keyframes subtleGlow {
      0%,100%{box-shadow:0 0 0 rgba(212,168,83,0)}
      50%{box-shadow:0 0 8px rgba(212,168,83,0.5)}
    }
    .no-sessions {
      padding: 32px 16px; text-align: center;
      color: var(--text-muted); font-size: 13px; line-height: 1.6;
    }

    /* ── MAIN ── */
    .main { flex:1; display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      min-height: 60px;
    }
    .chat-header-info { display: flex; align-items: center; gap: 12px; }
    .chat-header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .chat-header-name { font-size: 14px; font-weight: 600; }
    .chat-header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .chat-header-empty { font-size: 14px; color: var(--text-muted); }

    .chat-area {
      flex:1; overflow-y: auto;
      padding: 20px 20px 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius:2px; }

    .empty-state {
      flex:1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text-muted); gap: 10px;
    }
    .empty-icon { font-size: 40px; opacity: 0.3; }
    .empty-text { font-size: 14px; }

    /* ── BUBBLES ── */
    .bubble-wrap { display: flex; flex-direction: column; }
    .bubble-wrap.user { align-items: flex-end; }
    .bubble-wrap.admin { align-items: flex-start; }

    .bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px; line-height: 1.5;
      word-break: break-word;
    }
    .bubble.user {
      background: var(--surface2);
      border-bottom-right-radius: 4px;
    }
    .bubble.admin {
      background: linear-gradient(135deg, #1e1710, #2a1f0e);
      border: 1px solid rgba(212,168,83,0.18);
      border-bottom-left-radius: 4px;
      color: #f5e6c8;
    }
    .bubble img {
      max-width: 100%; border-radius: 10px; display: block;
      margin-top: 4px; cursor: pointer;
    }
    .bubble-meta {
      font-size: 10px; color: var(--text-muted);
      margin-top: 4px; padding: 0 2px;
    }

    /* ── INPUT ── */
    .input-wrapper {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .input-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .input-box {
      flex:1;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 10px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: rgba(212,168,83,0.4); }
    .input-box::placeholder { color: var(--text-muted); }

    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--surface2);
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.2s; font-size: 18px;
    }
    .icon-btn:hover { border-color: var(--gold); color: var(--gold); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--gold); border: none;
      color: #0a0a0a; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.2s;
    }
    .send-btn:hover { background: #e0b86a; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── IMAGE PREVIEW ── */
    .img-preview-bar {
      display: none;
      align-items: center; gap: 10px;
      padding: 8px 12px;
      background: var(--gold-dim);
      border: 1px solid rgba(212,168,83,0.2);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .img-preview-bar.visible { display: flex; }
    .img-preview-thumb {
      width: 48px; height: 48px; border-radius: 8px;
      object-fit: cover;
    }
    .img-preview-name { font-size: 12px; color: var(--text-muted); flex:1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-preview-remove {
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(239,68,68,0.2); border: none;
      color: var(--red); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── UPLOADING STATE ── */
    .uploading-bar {
      display: none;
      align-items: center; gap: 10px;
      padding: 8px 14px; font-size: 12px;
      color: var(--gold);
    }
    .uploading-bar.visible { display: flex; }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(212,168,83,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TOAST ── */
    .toast {
      position: fixed; top: 20px; left: 50%;
      transform: translateX(-50%);
      background: #1e1e1e; color: var(--text);
      padding: 9px 20px; border-radius: 24px;
      font-size: 13px; z-index: 999;
      border: 1px solid rgba(255,255,255,0.1);
      animation: toastIn 0.25s ease, toastOut 0.3s ease 1.8s forwards;
      pointer-events: none; white-space: nowrap;
    }
    .toast.error { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateX(-50%) translateY(-8px)} }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none; position: fixed; inset:0;
      background: rgba(0,0,0,0.9);
      z-index: 9999; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      .sidebar { display: none; }
      .sidebar.mobile-open { display: flex; position: fixed; inset:0; z-index:100; width:100%; }
      .mobile-back { display: flex !important; }
    }
    .mobile-back { display: none; }
    .mobile-menu-btn { display: none; }
    @media (max-width: 640px) {
      .mobile-menu-btn { display: flex; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">TF</div>
        <div>
          <div class="brand-text">TRIOFIT</div>
          <div class="brand-sub">Stylist Admin</div>
        </div>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        Live
      </div>
    </div>
    <div class="sessions-label">Conversations</div>
    <div class="sessions-list" id="sessionList">
      <div class="no-sessions">⏳<br>Waiting for messages…</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="chat-header">
      <div class="chat-header-info" id="chatHeaderInfo">
        <button class="icon-btn mobile-menu-btn" onclick="toggleSidebar()" style="width:36px;height:36px;font-size:16px;">☰</button>
        <span class="chat-header-empty">Select a conversation</span>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <div class="empty-icon">💬</div>
        <div class="empty-text">No conversation selected</div>
      </div>
    </div>

    <div class="input-wrapper" id="inputWrapper" style="display:none;">
      <div class="uploading-bar" id="uploadingBar">
        <div class="spinner"></div>
        Uploading image…
      </div>
      <div class="img-preview-bar" id="imgPreviewBar">
        <img class="img-preview-thumb" id="imgPreviewThumb" src="" alt="">
        <span class="img-preview-name" id="imgPreviewName"></span>
        <button class="img-preview-remove" onclick="clearImage()">✕</button>
      </div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Send image">🖼️</button>
        <textarea class="input-box" id="msgInput" placeholder="Reply as stylist…" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ══════════════════════════════════════════════
  //  CONFIGURATION — replace with your credentials
  // ══════════════════════════════════════════════
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const STORAGE_BUCKET = 'chat-images'; // create this bucket in Supabase Storage

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let activeSession = null;
  let allSessions = [];
  let seenIds = new Set();
  let pendingFile = null;

  // ── AUTO-RESIZE TEXTAREA ──
  const msgInput = document.getElementById('msgInput');
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── FILE PICKER ──
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    pendingFile = file;
    const url = URL.createObjectURL(file);
    document.getElementById('imgPreviewThumb').src = url;
    document.getElementById('imgPreviewName').textContent = file.name;
    document.getElementById('imgPreviewBar').classList.add('visible');
    e.target.value = '';
  });

  function clearImage() {
    pendingFile = null;
    document.getElementById('imgPreviewBar').classList.remove('visible');
    document.getElementById('imgPreviewThumb').src = '';
  }

  // ── LOAD SESSIONS ──
  async function loadSessions() {
    const { data, error } = await sb
      .from('messages')
      .select('id, session_id, message, sender, created_at, message_type')
      .order('created_at', { ascending: false })
      .limit(500);

    if (error) { showToast('❌ ' + error.message, true); return; }
    if (!data || !data.length) {
      document.getElementById('sessionList').innerHTML = '<div class="no-sessions">No messages yet</div>';
      return;
    }

    const map = new Map();
    data.forEach(r => {
      if (!map.has(r.session_id)) {
        map.set(r.session_id, {
          id: r.session_id,
          lastMessage: r.message_type === 'image' ? '🖼 Image' : r.message,
          lastSender: r.sender,
          lastTime: r.created_at,
          hasUnread: r.sender === 'user' && !seenIds.has(r.id)
        });
      }
    });
    allSessions = Array.from(map.values());
    renderSessions();
  }

  function renderSessions() {
    const el = document.getElementById('sessionList');
    if (!allSessions.length) {
      el.innerHTML = '<div class="no-sessions">No conversations yet</div>';
      return;
    }
    el.innerHTML = allSessions.map(s => {
      const short = s.id.replace('user_','').substring(0,10);
      const active = s.id === activeSession ? ' active' : '';
      const unread = s.hasUnread && s.id !== activeSession;
      return `<div class="session-item${active}" onclick="openSession('${s.id}')">
        <div class="session-avatar">👤</div>
        <div class="session-info">
          <div class="session-id">${short}…</div>
          <div class="session-preview">${s.lastSender === 'admin' ? '↩ ' : ''}${s.lastMessage || ''}</div>
        </div>
        ${unread ? '<div class="unread-dot"></div>' : ''}
      </div>`;
    }).join('');
  }

  // ── OPEN SESSION ──
  async function openSession(sessionId) {
    activeSession = sessionId;
    document.getElementById('inputWrapper').style.display = 'block';

    const s = allSessions.find(x => x.id === sessionId);
    if (s) s.hasUnread = false;
    renderSessions();

    // Update header
    const short = sessionId.replace('user_','').substring(0,14);
    document.getElementById('chatHeaderInfo').innerHTML = `
      <button class="icon-btn mobile-menu-btn" onclick="toggleSidebar()" style="width:36px;height:36px;font-size:16px;">☰</button>
      <div class="chat-header-avatar">👤</div>
      <div>
        <div class="chat-header-name">${short}…</div>
        <div class="chat-header-sub">Active conversation</div>
      </div>`;

    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML = '<div class="empty-state"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div></div>';

    const { data, error } = await sb
      .from('messages')
      .select('*')
      .eq('session_id', sessionId)
      .order('created_at', { ascending: true });

    chatArea.innerHTML = '';
    if (error) { chatArea.innerHTML = '<div class="empty-state"><div class="empty-text">Error loading</div></div>'; return; }
    if (!data || !data.length) {
      chatArea.innerHTML = '<div class="empty-state"><div class="empty-text">No messages yet</div></div>';
    } else {
      data.forEach(m => { renderBubble(m); seenIds.add(m.id); });
    }
    scrollBottom();
    msgInput.focus();

    // close sidebar on mobile
    document.getElementById('sidebar').classList.remove('mobile-open');
  }

  // ── RENDER BUBBLE ──
  function renderBubble(msg) {
    const chatArea = document.getElementById('chatArea');
    const empty = chatArea.querySelector('.empty-state');
    if (empty) empty.remove();

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap ' + msg.sender;

    const bub = document.createElement('div');
    bub.className = 'bubble ' + msg.sender;

    if (msg.message_type === 'image' && msg.message) {
      const img = document.createElement('img');
      img.src = msg.message;
      img.alt = 'Image';
      img.onclick = () => openLightbox(msg.message);
      bub.appendChild(img);
    } else {
      bub.textContent = msg.message || '';
    }

    const meta = document.createElement('div');
    meta.className = 'bubble-meta';
    const label = msg.sender === 'user' ? 'User' : 'You';
    const time = new Date(msg.created_at).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    meta.textContent = label + ' · ' + time;

    wrap.appendChild(bub);
    wrap.appendChild(meta);
    chatArea.appendChild(wrap);
  }

  // ── SEND MESSAGE ──
  async function sendMessage() {
    if (!activeSession) { showToast('Select a conversation first', true); return; }

    const text = msgInput.value.trim();
    if (!text && !pendingFile) return;

    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;

    try {
      if (pendingFile) {
        // Upload to Supabase Storage
        document.getElementById('uploadingBar').classList.add('visible');
        const ext = pendingFile.name.split('.').pop();
        const path = `${activeSession}/${Date.now()}.${ext}`;
        const { error: upErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, pendingFile, { cacheControl:'3600', upsert:false });
        document.getElementById('uploadingBar').classList.remove('visible');

        if (upErr) { showToast('Upload failed: ' + upErr.message, true); return; }

        const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        const imageUrl = urlData.publicUrl;

        const { error: insErr } = await sb.from('messages').insert({
          session_id: activeSession, sender: 'admin',
          message: imageUrl, message_type: 'image'
        });
        if (insErr) { showToast('Send failed', true); return; }

        renderBubble({ sender:'admin', message: imageUrl, message_type:'image', created_at: new Date().toISOString() });
        clearImage();
        showToast('Image sent ✨');
      }

      if (text) {
        msgInput.value = '';
        msgInput.style.height = 'auto';
        const { error } = await sb.from('messages').insert({
          session_id: activeSession, sender: 'admin',
          message: text, message_type: 'text'
        });
        if (error) { showToast('Send failed', true); return; }
        renderBubble({ sender:'admin', message: text, message_type:'text', created_at: new Date().toISOString() });
        showToast('Sent ✨');
      }

      scrollBottom();
    } finally {
      sendBtn.disabled = false;
      msgInput.focus();
    }
  }

  // ── REALTIME ──
  sb.channel('admin-rt')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, payload => {
      const msg = payload.new;
      const exists = allSessions.find(s => s.id === msg.session_id);
      const preview = msg.message_type === 'image' ? '🖼 Image' : msg.message;
      if (!exists) {
        allSessions.unshift({ id: msg.session_id, lastMessage: preview, lastSender: msg.sender, lastTime: msg.created_at, hasUnread: msg.sender === 'user' });
      } else {
        exists.lastMessage = preview;
        exists.lastSender = msg.sender;
        exists.lastTime = msg.created_at;
        if (msg.sender === 'user' && msg.session_id !== activeSession) exists.hasUnread = true;
      }
      renderSessions();
      if (msg.session_id === activeSession && msg.sender !== 'admin') {
        renderBubble(msg);
        seenIds.add(msg.id);
        scrollBottom();
      }
    })
    .subscribe();

  // ── HELPERS ──
  function scrollBottom() {
    const c = document.getElementById('chatArea');
    c.scrollTop = c.scrollHeight;
  }

  function showToast(msg, isError=false) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('mobile-open');
  }

  // ── INIT ──
  loadSessions();
</script>
</body>
</html>
