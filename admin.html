<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TRIOFIT · Admin</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRIOFIT Admin">
  <link rel="apple-touch-icon" href="logo.jpg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080808">

<style>
:root {
  --bg:       #080808;
  --s1:       #0f0f0f;
  --s2:       #161616;
  --s3:       #1e1e1e;
  --s4:       #272727;
  --gold:     #c9993a;
  --gold-lt:  #ddb04e;
  --gold-dim: rgba(201,153,58,0.12);
  --gold-bd:  rgba(201,153,58,0.22);
  --text:     #ececec;
  --text-2:   #999;
  --text-3:   #555;
  --border:   rgba(255,255,255,0.055);
  --green:    #3ecf6e;
  --red:      #e05252;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ════════ LAYOUT ════════ */
.app { display:flex; height:100vh; }

/* ════════ SIDEBAR ════════ */
.sidebar {
  width: 300px; min-width: 300px;
  background: var(--s1);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.sidebar-top {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.brand { display:flex; align-items:center; gap:10px; }
.brand-logo {
  width:30px; height:30px; border-radius:7px;
  object-fit: cover;
}
.brand-name { font-size:14px; font-weight:700; letter-spacing:.1em; color:var(--text); }
.brand-role { font-size:10px; color:var(--text-3); letter-spacing:.06em; margin-top:1px; }

.status-pill {
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 10px; border-radius:12px;
  background: rgba(62,207,110,0.07);
  border:1px solid rgba(62,207,110,0.18);
  font-size:10px; font-weight:600; letter-spacing:.04em; color:var(--green);
}
.live-dot { width:5px; height:5px; background:var(--green); border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Logo glow animation */
@keyframes logoGlow {
  0%, 100% { box-shadow: 0 0 8px rgba(201,153,58,0.3); }
  50% { box-shadow: 0 0 20px rgba(201,153,58,0.6); }
}
.logo-thinking {
  animation: logoGlow 1.5s ease-in-out infinite;
}

.search-wrap { position:relative; }
.search-input {
  width:100%; padding:9px 14px 9px 34px;
  background:var(--s2); border:1px solid var(--border);
  border-radius:10px; color:var(--text);
  font-size:13px; font-family:inherit; outline:none;
  transition:border-color .2s;
}
.search-input:focus { border-color:var(--gold-bd); }
.search-input::placeholder { color:var(--text-3); }
.search-icon {
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; opacity:.35;
}

.sessions-header {
  padding:14px 18px 6px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
.sessions-label { font-size:10px; font-weight:700; letter-spacing:.12em; color:var(--text-3); text-transform:uppercase; }
.sessions-count { font-size:10px; color:var(--text-3); font-weight:600; }

.sessions-list { flex:1; overflow-y:auto; padding:4px 8px 8px; }
.sessions-list::-webkit-scrollbar { width:3px; }
.sessions-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,.07); border-radius:2px; }

.session-item {
  padding:11px 12px; border-radius:10px;
  cursor:pointer; transition:background .15s;
  display:flex; align-items:center; gap:10px;
  margin-bottom:2px;
  position: relative;
}
.session-item:hover { background:rgba(255,255,255,.03); }
.session-item.active { background:var(--gold-dim); }

.s-avatar {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:var(--s3); border:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; justify-content:center;
}
.s-avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.s-avatar-initials { font-size:11px; font-weight:700; color:var(--text-2); letter-spacing:.02em; }
.session-item.active .s-avatar { border-color:var(--gold-bd); }

.s-info { flex:1; overflow:hidden; }
.s-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.s-preview { font-size:11px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.session-item.active .s-preview { color:var(--text-2); }

.s-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.s-time { font-size:10px; color:var(--text-3); }
.unread-badge {
  width:7px; height:7px; border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 6px rgba(201,153,58,.5);
}

.delete-session-btn {
  position: absolute;
  top: 8px; right: 8px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(224,82,82,0.15);
  border: none; color: var(--red);
  font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.15s;
}
.session-item:hover .delete-session-btn { opacity: 1; }
.delete-session-btn:hover { background: rgba(224,82,82,0.3); }

.no-sessions { padding:40px 16px; text-align:center; color:var(--text-3); font-size:13px; line-height:1.7; }

/* ════════ MAIN ════════ */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }

.chat-header {
  padding:14px 22px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  min-height:62px; flex-shrink:0;
}
.header-left { display:flex; align-items:center; gap:12px; }
.h-avatar {
  width:34px; height:34px; border-radius:50%;
  background:var(--s3); border:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  overflow: hidden;
}
.h-avatar img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.h-avatar-initials { font-size:11px; font-weight:700; color:var(--text-2); }
.h-name { font-size:14px; font-weight:600; }
.h-sub  { font-size:11px; color:var(--text-3); margin-top:2px; }
.h-empty { font-size:13px; color:var(--text-3); }

.header-right { display:flex; align-items:center; gap:8px; }
.h-action-btn {
  padding:7px 14px; border-radius:8px;
  background:var(--s3); border:1px solid var(--border);
  color:var(--text-2); font-size:12px; font-weight:500;
  cursor:pointer; font-family:inherit; transition:all .2s;
}
.h-action-btn:hover { border-color:var(--gold-bd); color:var(--gold); }

.profile-bar {
  display:none;
  padding:10px 22px;
  background:var(--s1);
  border-bottom:1px solid var(--border);
  gap:6px; flex-wrap:wrap; align-items:center;
}
.profile-bar.visible { display:flex; }
.profile-bar-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-right:4px; }
.profile-tag {
  padding:3px 10px; border-radius:6px;
  background:var(--s3); border:1px solid var(--border);
  font-size:11px; color:var(--text-2);
}
.profile-tag strong { color:var(--text); font-weight:600; }

.chat-area {
  flex:1; overflow-y:auto;
  padding:22px 22px 12px;
  display:flex; flex-direction:column; gap:10px;
}
.chat-area::-webkit-scrollbar { width:3px; }
.chat-area::-webkit-scrollbar-thumb { background:rgba(255,255,255,.06); border-radius:2px; }

.empty-state {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  color:var(--text-3);
}
.empty-logo {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  object-fit: cover;
  opacity: 0.5;
}
.empty-text { font-size:13px; }

.brow { display:flex; flex-direction:column; }
.brow.user  { align-items:flex-end; }
.brow.admin { align-items:flex-start; }
.brow.meta  { align-items:stretch; }

.meta-bar {
  background:var(--s2); border:1px solid var(--border);
  border-radius:10px; padding:10px 14px;
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
}
.meta-bar-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-right:4px; }
.meta-pill {
  padding:2px 9px; border-radius:5px;
  background:var(--s3); font-size:11px; color:var(--text-2);
}
.meta-pill strong { color:var(--text); }

.bubble {
  max-width:70%; padding:10px 14px;
  border-radius:14px; font-size:14px; line-height:1.56;
  word-break:break-word;
}
.bubble.user {
  background:var(--s2); border:1px solid rgba(255,255,255,.05);
  border-bottom-right-radius:3px; color:var(--text);
}
.bubble.admin {
  background:linear-gradient(140deg,#1a1408,#261c09);
  border:1px solid var(--gold-bd);
  border-bottom-left-radius:3px; color:#f0e0c0;
}
.bubble img { max-width:100%; border-radius:8px; display:block; cursor:pointer; margin-top:2px; }
.bmeta { font-size:10px; color:var(--text-3); margin-top:4px; padding:0 2px; letter-spacing:.02em; }

.input-wrapper {
  padding:12px 18px;
  padding-bottom:max(12px, env(safe-area-inset-bottom));
  background:var(--s1); border-top:1px solid var(--border);
  flex-shrink:0;
}
.upload-state {
  display:none; align-items:center; gap:8px;
  padding:6px 0 8px; font-size:11px; color:var(--gold);
}
.upload-state.visible { display:flex; }
.spinner {
  width:12px; height:12px;
  border:1.5px solid rgba(201,153,58,.2);
  border-top-color:var(--gold); border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.multi-preview {
  display:none; flex-direction: column; gap: 8px;
  margin-bottom: 8px; max-height: 200px; overflow-y: auto;
}
.multi-preview.visible { display:flex; }
.multi-preview-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px; background: var(--s2);
  border: 1px solid var(--border); border-radius: 8px;
}
.multi-preview-thumb {
  width: 48px; height: 48px; border-radius: 6px;
  object-fit: cover; flex-shrink: 0;
}
.multi-preview-caption {
  flex: 1; background: transparent; border: none;
  color: var(--text); font-size: 12px;
  font-family: inherit; outline: none; padding: 4px;
}
.multi-preview-caption::placeholder { color: var(--text-3); }
.multi-preview-rm {
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(224,82,82,0.15); border: none;
  color: var(--red); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

.input-row { display:flex; gap:8px; align-items:flex-end; }

.attach-btn {
  width:38px; height:38px; border-radius:9px;
  background:var(--s2); border:1px solid var(--border);
  color:var(--text-3); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .2s;
}
.attach-btn:hover { border-color:var(--gold-bd); color:var(--gold); }
.attach-btn svg { width:15px; height:15px; }

.msg-input {
  flex:1; padding:10px 15px;
  background:var(--s2); border:1px solid var(--border);
  border-radius:12px; color:var(--text);
  font-size:14px; font-family:inherit; outline:none;
  resize:none; max-height:120px; line-height:1.45;
  transition:border-color .2s;
}
.msg-input:focus { border-color:var(--gold-bd); }
.msg-input::placeholder { color:var(--text-3); }

.send-btn {
  width:38px; height:38px; border-radius:9px;
  background:var(--gold); border:none;
  color:#080808; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s; box-shadow:0 2px 10px rgba(201,153,58,.25);
}
.send-btn:hover { background:var(--gold-lt); }
.send-btn:active { transform:scale(.93); }
.send-btn:disabled { opacity:.3; cursor:not-allowed; box-shadow:none; }
.send-btn svg { width:15px; height:15px; fill:#080808; }

.toast {
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  padding:8px 20px; border-radius:20px;
  background:var(--s3); color:var(--text);
  font-size:12px; font-weight:500; letter-spacing:.02em;
  border:1px solid rgba(255,255,255,.09); z-index:9999;
  animation:tIn .25s ease, tOut .3s ease 1.8s forwards;
  pointer-events:none; white-space:nowrap;
}
.toast.err { color:#fca5a5; border-color:rgba(224,82,82,.3); }
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes tOut{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(-6px)}}

.lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:9999; align-items:center; justify-content:center; cursor:pointer; }
.lightbox.open { display:flex; }
.lightbox img { max-width:90vw; max-height:90vh; border-radius:10px; }

.mob-menu { 
  display:none; 
  width:36px; height:36px; 
  border-radius:8px; 
  background:var(--s2); 
  border:1px solid var(--border); 
  cursor:pointer; 
  align-items:center; 
  justify-content:center; 
}
.mob-menu svg { width:16px; height:16px; fill:var(--text-2); }

@media (max-width: 1024px) {
  .sidebar { display: none; }
  .sidebar.mobile-open { display: flex; position: fixed; inset: 0; z-index: 100; width: 100%; }
  .mob-menu { display: flex; }
}
</style>
</head>
<body>
<div class="app">

  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand-row">
        <div class="brand">
          <img class="brand-logo" src="logo.jpg" alt="TRIOFIT" id="sidebarLogo">
          <div>
            <div class="brand-name">TRIOFIT</div>
            <div class="brand-role">Admin Panel</div>
          </div>
        </div>
        <div class="status-pill"><div class="live-dot"></div>Live</div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Search conversations…" oninput="filterSessions(this.value)">
      </div>
    </div>

    <div class="sessions-header">
      <span class="sessions-label">Conversations</span>
      <span class="sessions-count" id="sessionsCount">—</span>
    </div>
    <div class="sessions-list" id="sessionList">
      <div class="no-sessions">Waiting for messages…</div>
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      <div class="header-left">
        <button class="mob-menu" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div id="headerContent">
          <span class="h-empty">Select a conversation to begin</span>
        </div>
      </div>
      <div class="header-right" id="headerActions" style="display:none;">
        <button class="h-action-btn" onclick="location.reload()">Refresh</button>
      </div>
    </div>

    <div class="profile-bar" id="profileBar"></div>

    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <img class="empty-logo" src="logo.jpg" alt="TRIOFIT">
        <div class="empty-text">No conversation selected</div>
      </div>
    </div>

    <div class="input-wrapper" id="inputWrapper" style="display:none;">
      <div class="upload-state" id="uploadState"><div class="spinner"></div>Uploading…</div>
      <div class="multi-preview" id="multiPreview"></div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="onFilesChange(event)">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach images">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <textarea class="msg-input" id="msgInput" rows="1" placeholder="Type a reply…"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL    = 'https://ahckbchulymvbhrpynyy.supabase.co';
const SUPABASE_KEY    = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoY2tiY2h1bHltdmJocnB5bnl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTI5MTQsImV4cCI6MjA5NjM4ODkxNH0.aBq-qHBBTrzWf_OHpkYmQLLPeS1iywBbX47tLRqRQ1k';
const STORAGE_BUCKET  = 'chat-images';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let activeSession = null;
let allSessions   = [];
let seenIds       = new Set();
let pendingFiles  = [];

const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function onFilesChange(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  files.forEach(file => { pendingFiles.push({ file: file, caption: '' }); });
  renderMultiPreview();
  e.target.value = '';
}

function renderMultiPreview() {
  const container = document.getElementById('multiPreview');
  if (!pendingFiles.length) { container.classList.remove('visible'); container.innerHTML = ''; return; }
  container.classList.add('visible');
  container.innerHTML = pendingFiles.map((item, index) => {
    const url = URL.createObjectURL(item.file);
    return `
      <div class="multi-preview-item">
        <img class="multi-preview-thumb" src="${url}" alt="${item.file.name}">
        <input class="multi-preview-caption" type="text" placeholder="Caption…" value="${esc(item.caption)}" oninput="updateCaption(${index}, this.value)">
        <button class="multi-preview-rm" onclick="removeFile(${index})">&#x2715;</button>
      </div>`;
  }).join('');
}

function updateCaption(index, value) { if (pendingFiles[index]) pendingFiles[index].caption = value; }
function removeFile(index) { pendingFiles.splice(index, 1); renderMultiPreview(); }
function clearAllFiles() { pendingFiles = []; renderMultiPreview(); }

function parseMeta(text) {
  const fields = {};
  if (!text || !text.startsWith('[PROFIL]')) return null;
  const body = text.replace('[PROFIL]', '').trim();
  body.split('|').forEach(chunk => {
    const [k, ...rest] = chunk.split(':');
    if (k && rest.length) fields[k.trim()] = rest.join(':').trim();
  });
  return fields;
}

function sessionDisplayName(sessionId, metaMap) {
  if (metaMap && metaMap['Nom']) return metaMap['Nom'];
  return sessionId.replace('user_','').substring(0,10) + '…';
}

async function loadSessions() {
  const { data, error } = await sb.from('messages')
    .select('id, session_id, message, sender, created_at, message_type')
    .order('created_at', { ascending: false }).limit(600);
  if (error) { toast('Error: ' + error.message, true); return; }
  if (!data || !data.length) {
    document.getElementById('sessionList').innerHTML = '<div class="no-sessions">No conversations yet</div>';
    return;
  }
  const map = new Map();
  const sorted = [...data].reverse();
  sorted.forEach(r => {
    if (!map.has(r.session_id)) {
      map.set(r.session_id, { id: r.session_id, meta: null, lastMessage: '', lastSender: r.sender, lastTime: r.created_at, hasUnread: false });
    }
    const s = map.get(r.session_id);
    if (r.message_type === 'meta') { s.meta = parseMeta(r.message); }
    else {
      s.lastMessage = r.message_type === 'image' ? 'Image' : (r.message || '').substring(0, 50);
      s.lastSender  = r.sender; s.lastTime = r.created_at;
      if (r.sender === 'user' && !seenIds.has(r.id)) s.hasUnread = true;
    }
  });
  allSessions = Array.from(map.values()).reverse();
  renderSessions(allSessions);
}

function renderSessions(list) {
  const el = document.getElementById('sessionList');
  document.getElementById('sessionsCount').textContent = list.length || '—';
  if (!list.length) { el.innerHTML = '<div class="no-sessions">No conversations yet</div>'; return; }
  el.innerHTML = list.map(s => {
    const name = sessionDisplayName(s.id, s.meta);
    const initials = name.slice(0,2).toUpperCase();
    const active = s.id === activeSession ? ' active' : '';
    const unread = s.hasUnread && s.id !== activeSession;
    const time   = s.lastTime ? relTime(s.lastTime) : '';
    const preview = (s.lastSender === 'admin' ? '&#x21A9; ' : '') + esc(s.lastMessage || '…');
    return `<div class="session-item${active}" onclick="openSession('${s.id}')">
      <div class="s-avatar"><span class="s-avatar-initials">${initials}</span></div>
      <div class="s-info"><div class="s-name">${esc(name)}</div><div class="s-preview">${preview}</div></div>
      <div class="s-meta"><span class="s-time">${time}</span>${unread ? '<div class="unread-badge"></div>' : ''}</div>
      <button class="delete-session-btn" title="Delete" onclick="event.stopPropagation(); deleteSession('${s.id}')">🗑</button>
    </div>`;
  }).join('');
}

function filterSessions(q) {
  if (!q.trim()) { renderSessions(allSessions); return; }
  const low = q.toLowerCase();
  renderSessions(allSessions.filter(s => {
    const name = sessionDisplayName(s.id, s.meta).toLowerCase();
    return name.includes(low) || s.id.includes(low);
  }));
}

async function deleteSession(sessionId) {
  if (!confirm('Delete this entire conversation permanently?')) return;
  const { error } = await sb.from('messages').delete().eq('session_id', sessionId);
  if (error) { toast('Delete failed', true); return; }
  allSessions = allSessions.filter(s => s.id !== sessionId);
  if (activeSession === sessionId) {
    activeSession = null;
    document.getElementById('inputWrapper').style.display = 'none';
    document.getElementById('headerActions').style.display = 'none';
    document.getElementById('headerContent').innerHTML = '<span class="h-empty">Select a conversation</span>';
    document.getElementById('profileBar').classList.remove('visible');
    document.getElementById('chatArea').innerHTML = '<div class="empty-state"><img class="empty-logo" src="logo.jpg" alt="TRIOFIT"><div class="empty-text">No conversation selected</div></div>';
  }
  renderSessions(allSessions);
  toast('Conversation deleted');
}
